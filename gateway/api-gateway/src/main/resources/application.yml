server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        - id: organization-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/organizations/**, /api/v1/workspaces/**, /api/v1/teams/**
          filters:
            - StripPrefix=0
            
        - id: billing-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/subscriptions/**, /api/v1/plans/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
