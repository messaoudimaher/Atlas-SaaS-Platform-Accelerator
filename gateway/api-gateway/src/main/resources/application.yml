server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  
  lifecycle:
    timeout-per-shutdown-phase: 30s

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9080/realms/atlas/protocol/openid-connect/certs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s
      default-filters:
        - AddRequestHeader=X-Gateway-Token, ${GATEWAY_SECRET:atlas_gateway_secret_key}
      routes:
        - id: organization-service
          uri: http://${ORG_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/v1/organizations/**, /api/v1/workspaces/**, /api/v1/teams/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@tenantKeyResolver}"

        - id: billing-service
          uri: http://${BILLING_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/subscriptions/**, /api/v1/plans/**
          filters:
            - StripPrefix=0
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@tenantKeyResolver}"

logging:
  pattern:
    level: "%5p [tenantId=%X{tenantId}, userId=%X{userId}, correlationId=%X{correlationId}, traceId=%X{traceId}, spanId=%X{spanId}]"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:9411/api/v2/spans
