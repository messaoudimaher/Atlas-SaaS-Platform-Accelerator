server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: notification-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/notification_db
    username: postgres
    password: postgres_secure
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false

logging:
  pattern:
    level: "%5p [tenantId=%X{tenantId}, userId=%X{userId}, correlationId=%X{correlationId}, traceId=%X{traceId}, spanId=%X{spanId}]"

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:9411/api/v2/spans

atlas:
  security:
    gateway-token-check:
      enabled: true
      secret: ${GATEWAY_SECRET:atlas_gateway_secret_key}
