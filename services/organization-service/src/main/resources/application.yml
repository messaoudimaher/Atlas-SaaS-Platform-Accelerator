server:
  port: 8082

spring:
  application:
    name: organization-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/org_db
    username: postgres
    password: postgres_secure
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${TEMPO_HOST:localhost}:9411/api/v2/spans
