server:
  port: 8082

spring:
  application:
    name: organization-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/org_db
    username: postgres
    password: postgres_secure
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
