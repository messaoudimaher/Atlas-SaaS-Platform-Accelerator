{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "atlas-service-chart.fullname" . }}
  labels:
    {{- include "atlas-service-chart.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "atlas-service-chart.selectorLabels" . | nindent 6 }}
{{- end }}
